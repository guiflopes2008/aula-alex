</head>
<body>

    <div class="container">
        <form id="frmLogin">
            <h3>Cadastro De Logs</h3>
            <form>
                <div class="mb-3">
                  <label for="nome" class="form-label">Nome completo</label>
                  <input type="nome" class="form-control" id="nome">
                </div>

                <div class="mb-3">
                    <label for="number" class="form-label">idade</label>
                    <input type="number" class="form-control" id="idade">
                  </div>  

                  <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email">
                  </div> 
                  

                <div class="mb-3">
                  <label for="senha" class="form-label">Senha</label>
                  <input type="password" class="form-control" id="senha">
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Confirmar Senha</label>
                    <input type="password" class="form-control" id="confSenha">
                  </div>


                <button type="submit" class="btn btn-primary">Enviar</button>
                <a href="/tiin-backend/src/view/index.html">login</a>
            </form>
        </form>
    </div>
